<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>법안 영향 지도 · 이 법 통과되면 우리 동네 몇 채?</title>
  <meta name="description" content="국회 계류 법안의 적용 기준을 건물 데이터와 대조해 영향받는 건물을 지도에 표시하는 시제품 (청주시 사창동)" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>법안 영향 지도</h1>
      <p class="sub">이 법 통과되면 우리 동네 몇 채?</p>
    </div>
    <div class="region"><span class="dot"></span>시범 지역 · 청주시 서원구 <b>사창동</b> <span class="muted" id="bldg-total"></span></div>
  </header>

  <main class="layout">
    <aside class="panel" id="panel">
      <section class="filters">
        <div class="filter-head">
          <h2>분야</h2>
          <div class="filter-actions">
            <button type="button" id="f-all">전체</button>
            <button type="button" id="f-none">해제</button>
          </div>
        </div>
        <div id="field-list" class="field-list"></div>
        <input id="search" type="search" placeholder="법안명·번호·제안이유 검색" autocomplete="off" />
        <p class="muted small" id="bill-count"></p>
      </section>

      <section id="detail" class="detail hidden" aria-live="polite"></section>

      <section class="bills">
        <ul id="bill-list"></ul>
      </section>
    </aside>

    <div class="map-wrap">
      <div id="map" role="region" aria-label="사창동 건물 3D 지도"></div>
      <div class="legend" id="legend"></div>
      <p class="map-note" id="map-note">판정은 건축물 데이터 기반 추정이며 법률 판단이 아닙니다 · 개인정보 미수집</p>
    </div>
  </main>

  <script>
    // 브이월드 WebGL 3D 지도 (버전 3.0). 키는 저장소에 두지 않고 배포할 때 GitHub Secret(VWORLD_KEY)으로 넣는다.
    // 키가 없으면(__로 시작하는 자리표시자 그대로) 브이월드를 불러오지 않고 기본 3D 지도(MapLibre, 필요할 때만 로드)를 쓴다.
    (function () {
      var key = "__VWORLD_KEY__";
      if (key.indexOf("__") === 0) return;
      window.VWORLD_ON = true;
      if (/[?&]map=basic(&|$)/.test(location.search)) return; // 가벼운 지도를 고른 경우
      document.write('<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=' +
        encodeURIComponent(key) + "&domain=" + encodeURIComponent(location.origin) + '"><\/script>');
    })();
  </script>
  <script src="judge.js"></script>
  <script src="vworld.js"></script>
  <script src="app.js"></script>
</body>
</html>
