# 사창동 건축물대장 표제부 수집 (공공데이터포털 건축HUB getBrTitleInfo)
# 공공데이터포털 키는 GitHub Secret DATA_GO_KR_KEY 로만 쓴다. 키가 없으면 조용히 건너뛴다.
# 결과 data/bldg_register_사창동.csv 를 실행한 브랜치에 커밋한다.
name: Collect building register

on:
  push:
    branches: [feat/bldg-register]
    paths:
      - collect/collect_register.py
      - .github/workflows/collect-register.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r collect/requirements.txt
      - name: Probe data.go.kr (no key)
        run: |
          # 키 없이 불러 러너 IP 에서 응답이 오는지만 본다 (정상이면 키 없음 오류가 온다)
          curl -s -o probe.txt -w "HTTP %{http_code} " --max-time 20 "https://apis.data.go.kr/1613000/BldRgstHubService/getBrTitleInfo?sigunguCd=43112&bjdongCd=10200&_type=json&numOfRows=1&pageNo=1" || true
          head -c 300 probe.txt || true; echo; rm -f probe.txt
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -u collect/collect_register.py
      - name: Commit
        run: |
          f="data/bldg_register_사창동.csv"
          if [ ! -f "$f" ]; then echo "파일이 없음 (키 없음 또는 응답 이상)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf input
          git add "$f"
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "data: 사창동 건축물대장 표제부 수집"
          git push origin HEAD:${{ github.ref_name }}
