name: Deploy web prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # 매일 법안 수집(daily-collect.yml)이 커밋한 뒤 직접 부른다
  workflow_call:
    inputs:
      ref:
        description: "배포할 커밋"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      # 브이월드 키는 저장소에 커밋하지 않고 배포본에만 넣는다 (키는 배포 도메인 전용으로 발급)
      - name: Insert VWorld key
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: |
          if [ -n "$VWORLD_KEY" ]; then
            sed -i "s/__VWORLD_KEY__/${VWORLD_KEY}/" web/index.html
            echo "VWorld key inserted"
          else
            echo "VWORLD_KEY secret not set: basic map only"
          fi
      # Supabase 공개(anon/publishable) 키. RLS 로 막힌 범위만 쓸 수 있는 키라 화면에 들어가도 되지만
      # 저장소에는 넣지 않고 배포본에만 넣는다. 없으면 화면은 지금처럼 이 브라우저(localStorage)에만 저장한다.
      # 서비스 키(service_role)는 여기 넣지 않는다 (Vercel·Actions 전용)
      - name: Insert Supabase anon key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            case "$SUPABASE_ANON_KEY" in
              *[!A-Za-z0-9._-]*) echo "SUPABASE_ANON_KEY has unexpected characters: not inserted"; exit 0 ;;
            esac
            sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|" web/config.js
            echo "Supabase anon key inserted"
          else
            echo "SUPABASE_ANON_KEY secret not set: progress stays in each browser"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
