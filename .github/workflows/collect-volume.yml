# 주별 의원 발의 법안 수 수집 (RNN 발의량 예측 노트북용)
# 21대·22대 의안 목록을 받아 주별 건수만 data/bill_volume_weekly.csv 로 같은 브랜치에 커밋한다.
# 열린국회 키는 GitHub Secret ASSEMBLY_API_KEY 로만 쓴다. 키가 없으면 조용히 건너뛴다.
name: Collect bill volume

on:
  push:
    branches: [feat/bill-volume-rnn]
    paths: ["collect/collect_volume.py", ".github/workflows/collect-volume.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r collect/requirements.txt
      - name: Collect
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python collect/collect_volume.py
      - name: Commit
        run: |
          f="data/bill_volume_weekly.csv"
          if [ ! -f "$f" ]; then echo "파일이 없음 (키 없음 또는 응답 이상)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf input
          git add "$f"
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "data: 주별 의원 발의 법안 수 수집 (21·22대)"
          git push origin HEAD:${{ github.ref_name }}
